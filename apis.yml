description: 'Mind Candy Ltd is a London-based children''s media and technology company,
  originally known for the Moshi Monsters online game and now operating Moshi, an award-winning
  children''s app for sleep, relaxation and learning. Moshi offers hundreds of hours of
  bedtime stories, sleep sounds, music, white noise and educational activities delivered
  through iOS and Android consumer apps. The company was surfaced as a portfolio company
  of Accel and added to the API Evangelist network. Moshi is a direct-to-consumer subscription
  product and does not currently publish a public developer API, SDK, or developer portal.'
